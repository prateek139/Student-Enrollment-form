<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form - JsonPowerDB</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <!-- Main Form Card -->
                <div class="card shadow-lg">
                    <div class="card-header text-center">
                        <h2><i class="fa-solid fa-graduation-cap me-2"></i>Student Enrollment Form</h2>
                        <span class="badge badge-db mt-1">
                            <i class="fa-solid fa-database me-1"></i> SCHOOL-DB / STUDENT-TABLE (JsonPowerDB)
                        </span>
                    </div>
                    
                    <div class="card-body p-4 p-md-5">
                        <!-- Token Configuration Accordion -->
                        <div class="accordion mb-4" id="configAccordion">
                            <div class="accordion-item border rounded">
                                <h2 class="accordion-header" id="headingConfig">
                                    <button class="accordion-button collapsed py-2 px-3 bg-light text-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseConfig" aria-expanded="false" aria-controls="collapseConfig">
                                        <i class="fa-solid fa-key me-2"></i> JPDB Connection Settings (Optional)
                                    </button>
                                </h2>
                                <div id="collapseConfig" class="accordion-collapse collapse" aria-labelledby="headingConfig" data-bs-parent="#configAccordion">
                                    <div class="accordion-body bg-light">
                                        <div class="mb-2">
                                            <label for="connTokenInput" class="form-label text-muted small">Connection Token:</label>
                                            <input type="text" class="form-control form-control-sm" id="connTokenInput" placeholder="90933129|-31949221379430331|90951165" value="90933129|-31949221379430331|90951165">
                                            <div class="form-text small">Using default demo token. Replace with your Login2Xplore token anytime.</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Status Alert Banner -->
                        <div id="statusMsg" class="alert alert-info py-2 px-3 small d-none" role="alert"></div>

                        <!-- Form Definition -->
                        <form id="studentForm">
                            <div class="row g-3">
                                <!-- Roll No (Primary Key) -->
                                <div class="col-md-6">
                                    <label for="rollNo" class="form-label">
                                        Roll No <span class="text-required">*</span> <span class="badge bg-secondary ms-1">Primary Key</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                                        <input type="text" class="form-control" id="rollNo" placeholder="Enter Roll Number" onchange="getStudent();" required autocomplete="off">
                                    </div>
                                    <div class="form-text small">Press Tab or click outside after entering Roll-No.</div>
                                </div>

                                <!-- Full Name -->
                                <div class="col-md-6">
                                    <label for="fullName" class="form-label">Full Name <span class="text-required">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                        <input type="text" class="form-control" id="fullName" placeholder="Enter Student Full Name" required>
                                    </div>
                                </div>

                                <!-- Class -->
                                <div class="col-md-6">
                                    <label for="class" class="form-label">Class <span class="text-required">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-school"></i></span>
                                        <input type="text" class="form-control" id="class" placeholder="e.g. 10th, 12th, B.Tech CSE" required>
                                    </div>
                                </div>

                                <!-- Birth Date -->
                                <div class="col-md-6">
                                    <label for="birthDate" class="form-label">Birth Date <span class="text-required">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-calendar-day"></i></span>
                                        <input type="date" class="form-control" id="birthDate" required>
                                    </div>
                                </div>

                                <!-- Address -->
                                <div class="col-12">
                                    <label for="address" class="form-label">Address <span class="text-required">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                                        <input type="text" class="form-control" id="address" placeholder="Enter Residential Address" required>
                                    </div>
                                </div>

                                <!-- Enrollment Date -->
                                <div class="col-md-6">
                                    <label for="enrollmentDate" class="form-label">Enrollment Date <span class="text-required">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-calendar-check"></i></span>
                                        <input type="date" class="form-control" id="enrollmentDate" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex justify-content-center gap-3 mt-4 pt-3 border-top">
                                <button type="button" class="btn btn-primary px-4" id="save" onclick="saveData();" disabled>
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Save
                                </button>
                                <button type="button" class="btn btn-warning text-white px-4" id="update" onclick="updateData();" disabled>
                                    <i class="fa-solid fa-pen-to-square me-1"></i> Update
                                </button>
                                <button type="button" class="btn btn-secondary px-4" id="reset" onclick="resetForm();" disabled>
                                    <i class="fa-solid fa-rotate-right me-1"></i> Reset
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="card-footer bg-light text-center py-3">
                        <small class="text-muted">
                            Powered by <a href="http://login2explore.com/jpdb/resources/js/0.0.4/jpdb-commons.js" target="_blank" class="text-decoration-none">JsonPowerDB (JPDB)</a> &bull; Apache NetBeans HTML5 Web Application
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts: jQuery, Bootstrap, JPDB Commons, and Application Script -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JPDB Commons (Local fallback with CDN) -->
    <script src="js/jpdb-commons.js"></script>
    <!-- Application Logic -->
    <script src="js/index.js"></script>
</body>
</html>
